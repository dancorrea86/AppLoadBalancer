services:
  nginx:
    image: nginx:alpine
    container_name: load_balancer_nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    networks:
      - lb_network

  server1:
    image: danmcorrea/apploadbalancer-server:latest
    container_name: server1
    environment:
      - SERVER_NAME=Servidor 1
    networks:
      - lb_network

  server2:
    image: danmcorrea/apploadbalancer-server:latest
    container_name: server2
    environment:
      - SERVER_NAME=Servidor 2
    networks:
      - lb_network

  server3:
    image: danmcorrea/apploadbalancer-server:latest
    container_name: server3
    environment:
      - SERVER_NAME=Servidor 3
    networks:
      - lb_network

networks:
  lb_network:
    driver: bridge